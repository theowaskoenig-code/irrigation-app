<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e42aa">
<title>Balcony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css?v=202610171316">
</head>
<body>
<header class="topbar"><h1>Balcony</h1><div class="conn offline" id="conn"><span class="fw" id="fw"></span><span class="dot"></span><span>…</span></div></header>
<div class="downbar" id="downbar" hidden role="status">☁ ✕</div>
<main>
  <section class="screen active" id="screen-home"></section>
</main>
<!-- spider tones: an emoji's shape filled with one status colour -->
<svg class="defs" aria-hidden="true">
  <filter id="tone-dry"><feFlood style="flood-color:var(--amber)"/><feComposite in2="SourceAlpha" operator="in"/></filter>
  <filter id="tone-ok"><feFlood style="flood-color:var(--green)"/><feComposite in2="SourceAlpha" operator="in"/></filter>
  <filter id="tone-wet"><feFlood style="flood-color:var(--wet)"/><feComposite in2="SourceAlpha" operator="in"/></filter>
  <filter id="tone-run"><feFlood style="flood-color:var(--accent)"/><feComposite in2="SourceAlpha" operator="in"/></filter>
  <filter id="tone-nos"><feFlood style="flood-color:var(--text-3)"/><feComposite in2="SourceAlpha" operator="in"/></filter>
</svg>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div class="login" id="login" hidden>
  <form id="login-form" novalidate>
    <h2>Balcony</h2>
    <label>Email<input id="login-email" type="email" autocomplete="username" required></label>
    <label>Password<input id="login-pw" type="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="login-stay" checked> Stay signed in</label>
    <div class="err" id="login-err" role="alert"></div>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>
<!-- plain scripts (no modules): the file opens by double-click as well as over http -->
<script src="rules.js?v=202610171316"></script>
<script src="weather.js?v=202610171316"></script>
<script src="mock.js?v=202610171316"></script>
<script src="lan.js?v=202610171316"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.min.js"></script>
<script src="supabase.js?v=202610171316"></script>
<script src="backend.js?v=202610171316"></script>
<script src="app.js?v=202610171316"></script>
</body>
</html>
